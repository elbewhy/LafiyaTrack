<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Child | LafiyaTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/register-child.css">

</head>

<body class="bg-light">

<div class="container py-4">

    <h2 class="mb-4">Child Registration</h2>

    <form id="childForm">

        <div class="mb-3">
            <label class="form-label">Child's First Name</label>
            <input type="text" id="firstName" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Child's Last Name</label>
            <input type="text" id="lastName" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Sex</label>
            <select id="sex" class="form-select" required>
                <option value="">Select Sex</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Date of Birth (If Known)</label>
            <input type="date" id="dob" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Estimated Age (Months)</label>
            <input type="number" id="ageMonths" class="form-control" min="0">
        </div>

        <button class="btn btn-success w-100">
            Register Child
        </button>

    </form>

</div>

<script src="../js/services/storage.js"></script>
<script src="../js/register-child.js"></script>

</body>

</html>
