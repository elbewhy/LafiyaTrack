<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Start Outreach | LafiyaTrack</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/outreach.css">

</head>

<body>

<div class="container py-4">

<div class="text-center mb-4">

<h2 class="text-success fw-bold">
Start Outreach
</h2>

<p class="text-muted">
Create a new outreach session
</p>

</div>

<form id="outreachForm">

<div class="mb-3">

<label class="form-label">

Programme

</label>

<select class="form-select" id="programme">

<option selected disabled>Select programme</option>

<option>Routine Nutrition Screening</option>

<option>CMAM Outreach</option>

<option>Vitamin A Campaign</option>

<option>NGO Programme</option>

<option>Other</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">

Activity Type

</label>

<select class="form-select" id="activity">

<option selected disabled>Select activity</option>

<option>House-to-house</option>

<option>Health Facility</option>

<option>Community Outreach</option>

<option>School Screening</option>

<option>Follow-up Visit</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">

Village

</label>

<input
type="text"
class="form-control"
id="village"
placeholder="Search or enter village">

</div>

<div class="mb-3">

<label class="form-label">

Date

</label>

<input
type="date"
class="form-control"
id="date">

</div>

<div class="mb-4">

<label class="form-label">

Notes (Optional)

</label>

<textarea
class="form-control"
rows="3"
placeholder="Additional notes..."></textarea>

</div>

<button
type="submit"
class="btn btn-success w-100">

Start Outreach

</button>

</form>

</div>

<script src="../js/outreach.js"></script>

</body>

</html>
