<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Start Outreach</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/outreach.css">

</head>

<body class="bg-light">

<div class="container py-4">

<h2 class="mb-4">

Start Outreach Session

</h2>

<form id="outreachForm">

<div class="mb-3">

<label>

Programme

</label>

<select
class="form-select"
id="programme"
required>

<option value="">Select Programme</option>

<option>Routine Nutrition Screening</option>

<option>CMAM</option>

<option>Growth Monitoring</option>

<option>Integrated Outreach</option>

</select>

</div>

<div class="mb-3">

<label>

Village

</label>

<input

type="text"

id="village"

class="form-control"

placeholder="Enter village"

required>

</div>

<div class="mb-3">

<label>

Date

</label>

<input

type="date"

id="date"

class="form-control"

required>

</div>

<button

class="btn btn-success w-100">

Start Outreach

</button>

</form>

</div>

<script src="../js/services/storage.js"></script>
<script src="../js/outreach.js"></script>

</body>

</html>
