<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Referral | LafiyaTrack</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/forms.css">
</head>

<body class="bg-light">

<div class="container py-4">

<h2>Create Referral</h2>

<div class="card p-4 shadow-sm">

<form id="referralForm">

<div class="mb-3">

<label class="form-label">
Referral Facility
</label>

<select
id="facility"
class="form-select"
required>

<option value="">
Select Facility
</option>

<option>Bunza General Hospital</option>

<option>PHC Bunza</option>

<option>Specialist Hospital Birnin Kebbi</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">

Reason

</label>

<input
id="reason"
class="form-control"
readonly>

</div>

<div class="mb-3">

<label class="form-label">

Additional Notes

</label>

<textarea
id="notes"
class="form-control"
rows="4"></textarea>

</div>

<button
type="submit"
class="btn btn-danger w-100">

Create Referral

</button>

</form>

</div>

</div>

<script src="../js/referral.js"></script>

</body>

</html>
