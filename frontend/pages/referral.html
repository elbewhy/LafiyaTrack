<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Referral | LafiyaTrack</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/referral.css">

</head>

<body class="bg-light">

<div class="container py-4">

<h2 class="mb-4">Child Referral</h2>

<div class="alert alert-warning">

<strong>Child:</strong>
<span id="childName"></span>

<br>

<strong>Nutrition Status:</strong>
<span id="nutritionStatus"></span>

</div>

<form id="referralForm">

<div class="mb-3">

<label class="form-label">

Referral Facility

</label>

<select
id="facility"
class="form-select"
required>

<option value="">Select Facility</option>

<option>Primary Health Centre (PHC)</option>

<option>General Hospital</option>

<option>Nutrition Stabilization Centre</option>

<option>Teaching Hospital</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">

Referral Notes

</label>

<textarea
id="notes"
rows="4"
class="form-control"
placeholder="Enter additional notes (optional)"></textarea>

</div>

<button
class="btn btn-danger w-100">

Create Referral

</button>

</form>

</div>

<script src="../js/services/storage.js"></script>
<script src="../js/referral.js"></script>

</body>

</html>
