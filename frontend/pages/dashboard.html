<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LafiyaTrack Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/dashboard.css">

</head>

<body>

<div class="container py-4">

    <h2 class="mb-4">
        Community Health Dashboard
    </h2>

    <div class="row g-3">

        <div class="col-md-4">
            <div class="dashboard-card">
                <h5>Households</h5>
                <h2 id="householdsCount">0</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="dashboard-card">
                <h5>Children</h5>
                <h2 id="childrenCount">0</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="dashboard-card">
                <h5>Screenings</h5>
                <h2 id="screeningsCount">0</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="dashboard-card success">
                <h5>Normal</h5>
                <h2 id="normalCount">0</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="dashboard-card warning">
                <h5>MAM</h5>
                <h2 id="mamCount">0</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="dashboard-card danger">
                <h5>SAM</h5>
                <h2 id="samCount">0</h2>
            </div>
        </div>

        <div class="col-md-6">
            <div class="dashboard-card">
                <h5>Pending Referrals</h5>
                <h2 id="referralCount">0</h2>
            </div>
        </div>

        <div class="col-md-6">
            <div class="dashboard-card">
                <h5>Scheduled Follow-ups</h5>
                <h2 id="followupCount">0</h2>
            </div>
        </div>

    </div>

</div>

<script src="../js/services/storage.js"></script>
<script src="../js/dashboard.js"></script>

</body>

</html>
