<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Household | LafiyaTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/forms.css">
</head>

<body class="bg-light">

<div class="container py-4">

    <h2 class="page-title mb-4">
        Register Household
    </h2>

    <div class="form-card">

        <form id="householdForm">

            <div class="mb-3">
                <label class="form-label">
                    Head of Household <span class="required">*</span>
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="headName"
                    required>
            </div>

            <div class="mb-3">

                <label class="form-label">
                    Primary Caregiver <span class="required">*</span>
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="caregiver"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Phone Number

                </label>

                <input
                    type="tel"
                    class="form-control"
                    id="phone">

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Village <span class="required">*</span>

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="village"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Landmark (Optional)

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="landmark">

            </div>

            <button
                type="submit"
                class="btn btn-success w-100">

                Save Household

            </button>

        </form>

    </div>

</div>

<script src="../js/household.js"></script>

</body>
</html>
